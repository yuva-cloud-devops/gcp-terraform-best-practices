# ==============================================================================
# Container Infrastructure Configuration (GKE Autopilot & Secret Integration)
# Compatible with Google Kubernetes Engine (Autopilot), Artifact Registry,
# Gateway API, and External Secret Manager Workload Integration.
# ==============================================================================
container_infrastructure:
  project_id: "yuvaraj-internal-project"
  region: "asia-south1"
  network: "projects/yuvaraj-internal-project/global/networks/testing-environment-vpc"
  subnetwork: "projects/yuvaraj-internal-project/regions/asia-south1/subnetworks/testing-environment-private-subnet-mumbai"
  tags:
    environment: "dev"
    managed-by: "terraform"
    tier: "container-platform"

  # ============================================================================
  # 1. Google Artifact Registry (Already Provisioned)
  # ============================================================================
  artifact_registries:
    app-docker-repo:
      description: "Docker repository for production and microservice container images"
      format: "DOCKER"
      immutable_tags: false
      vulnerability_scanning: false
      cleanup_policies:
        keep_recent_versions:
          action: "KEEP"
          most_recent_versions:
            keep_count: 5

  # ============================================================================
  # 2. GKE Clusters (Autopilot Mode with VPC-Native Private Networking)
  # ============================================================================
  clusters:
    gke-autopilot-cluster:
      mode: "AUTOPILOT" # 100% Google-managed worker nodes and autoscaling
      location: "asia-south1" # Regional high-availability control plane
      pods_secondary_range_name: "gke-pods-mumbai"
      services_secondary_range_name: "gke-services-mumbai"
      master_ipv4_cidr_block: "172.16.0.0/28"
      enable_private_nodes: true
      enable_private_endpoint: false
      release_channel: "REGULAR"
      workload_identity: true
      deletion_protection: false

      # ------------------------------------------------------------------------
      # GKE Addons (Gateway API, Ingress HTTP LB, Secret Manager CSI Driver)
      # ------------------------------------------------------------------------
      addons:
        http_load_balancing: true
        gateway_api_channel: "CHANNEL_STANDARD" # Enables native K8s Gateway API Controller
        secret_manager: true                    # Installs Secret Manager CSI Driver

      master_authorized_networks:
        - cidr_block: "0.0.0.0/0"
          display_name: "public-admin-access"

  # ============================================================================
  # 3. GKE Ingress, Gateway API & Network Endpoint Groups (NEGs)
  # ============================================================================
  ingress_gateways:
    ip_reservations:
      # Global External Anycast IP for kind: Gateway (gke-l7-global-external-managed)
      gke-public-gateway-ip:
        type: "GLOBAL_EXTERNAL"
        description: "Static Anycast IP for Public Gateway API"

  # ============================================================================
  # 4. External Secrets & Workload Identity Permissions
  # ============================================================================
  secrets_and_config:
    # Grant Kubernetes Pods direct read access to existing Secret Manager secret
    secret_manager_access:
      - secret_id: "projects/986244541727/secrets/github-app-private-key"
        namespace: "default"
        service_account: "app-workload-sa"
