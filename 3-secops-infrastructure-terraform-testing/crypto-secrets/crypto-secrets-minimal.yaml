project_id: "yuvaraj-internal-project"
default_location: "asia-south1"

# ==============================================================================
# 1. Cloud KMS (Keyring + CMEK CryptoKey + IAM)
# ==============================================================================
kms:
  keyrings:
    - name: "app-keyring"
      location: "asia-south1"
      keys:
        - name: "app-data-key"
          purpose: "ENCRYPT_DECRYPT"
          rotation_period: "7776000s" # 90-day automatic rotation
          iam:
            - role: "roles/cloudkms.cryptoKeyEncrypterDecrypter"
              members:
                - "serviceAccount:demo-service-account-1@yuvaraj-internal-project.iam.gserviceaccount.com"

# ==============================================================================
# 2. Secret Manager (Secret Container + CMEK Encryption + Payload + IAM)
# ==============================================================================
secret_manager:
  secrets:
    - secret_id: "app-db-password"
      replication:
        type: "user_managed"
        customer_managed_encryption:
          # Directly refers to the KMS key defined above (keyring/key)
          kms_key_name: "app-keyring/app-data-key"

      # Optional initial secret payload
      version:
        secret_data: "SuperSecretPassword123!"

      # Least-privilege access for application
      iam:
        - role: "roles/secretmanager.secretAccessor"
          members:
            - "serviceAccount:demo-service-account-1@yuvaraj-internal-project.iam.gserviceaccount.com"