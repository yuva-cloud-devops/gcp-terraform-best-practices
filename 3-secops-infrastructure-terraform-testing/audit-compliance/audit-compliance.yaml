# ------------------------------------------------------------------------------
# 2. Managed Destinations (Auto-created by Terraform)
# ------------------------------------------------------------------------------
destinations:
  # Cloud Storage: Cold compliance storage with WORM retention policy
  storage_buckets:
    - name: "secops-audit-cold-storage-yuvaraj-internal-project" # Must be globally unique
      location: "asia-south1"
      storage_class: "STANDARD"
      versioning: true
      retention_policy:
        retention_period_days: 365
        is_locked: false # Set to true only in final production to lock WORM
      lifecycle_rules:
        - action:
            type: "SetStorageClass"
            storage_class: "COLDLINE"
          condition:
            age: 90

