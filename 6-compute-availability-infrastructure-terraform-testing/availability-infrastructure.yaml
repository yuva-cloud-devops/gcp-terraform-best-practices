availability:
  project_id: "yuvaraj-internal-project"
  region: "asia-south1"

  tags:
    environment: "testing"
    managed_by: "terraform"

  # ============================================================================
  # PHASE 1: Internal L4 TCP Passthrough Network Load Balancer (ACTIVE FOR TESTING)
  # Ultra-low latency, original client IP preserved, Active-Passive failover
  # ============================================================================
  internal_tcp_lb:
    name: "nlb-web-app"
    network: "projects/yuvaraj-internal-project/global/networks/testing-environment-vpc"
    subnetwork: "projects/yuvaraj-internal-project/regions/asia-south1/subnetworks/testing-environment-private-subnet-mumbai"
    ports: ["3000"]
    target_mig: "web-app-regional-mig" # Points directly to Go app Regional MIG

    # Dedicated TCP probe on port 3000
    health_check:
      type: "TCP"
      port: 3000
      check_interval_sec: 10
      timeout_sec: 5
      healthy_threshold: 2
      unhealthy_threshold: 3
      logging: true

    # Optional Active-Passive Failover Policy (uncomment when backup MIG is present)
    # failover_mig: "web-app-failover-mig"
    # failover_policy:
    #   failover_ratio: 0.1
    #   disable_connection_drain_on_failover: false
    #   drop_traffic_if_unhealthy: true


